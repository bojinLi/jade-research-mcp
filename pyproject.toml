[project]
name = "jade-research-mcp"
version = "0.1.0"
description = "Local Windows JADE control and reproducible powder XRD analysis"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "pywinauto==0.6.9", "numpy>=2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "pymatgen>=2025", "psutil>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
jade-mcp = "jade_mcp.server:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jade_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
